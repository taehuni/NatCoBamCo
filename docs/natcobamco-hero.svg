<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">NatCoBamCo</title>
  <desc id="desc">A day and night survival defense game banner showing resource gathering by day and tower defense by night.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset=".46" stop-color="#fb923c"/>
      <stop offset=".54" stop-color="#243b63"/>
      <stop offset="1" stop-color="#08152b"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243f2a"/>
      <stop offset="1" stop-color="#101d17"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset=".5" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="460" rx="28" fill="url(#sky)"/>
