    <text x="2" y="163" fill="#fef3c7" font-family="Arial, sans-serif" font-size="23" font-weight="700">Gather by day. Defend the shelter by night.</text>
    <text x="2" y="211" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="18">Exploration · Survivors · Building · Tower Defense</text>
